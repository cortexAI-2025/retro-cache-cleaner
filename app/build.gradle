plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Release signing ────────────────────────────────────────────────────────
// Credentials are read from keystore.properties (never committed to git).
// Copy keystore.properties.example → keystore.properties and fill in values.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.retrocache.cleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.retrocache.cleaner"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // ── Signing ─────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            storeFile     keystoreProps['storeFile']     ? file(keystoreProps['storeFile'])     : null
            storePassword keystoreProps['storePassword'] ?: ''
            keyAlias      keystoreProps['keyAlias']      ?: ''
            keyPassword   keystoreProps['keyPassword']   ?: ''
        }
    }

    // ── Build types ─────────────────────────────────────────────────────────
    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            signingConfig   signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
    }

    // ── AAB / Android App Bundle configuration ───────────────────────────────
    // Enables per-device asset splits → smaller download size on Play Store.
    bundle {
        language {
            // Split by language so only the device's locale is downloaded.
            enableSplit = true
        }
        density {
            // Split by screen density (hdpi, xhdpi, …) → smaller APK.
            enableSplit = true
        }
        abi {
            // Split by CPU ABI (arm64-v8a, x86_64, …) → smaller APK.
            enableSplit = true
        }
    }

    // ── Compile options ──────────────────────────────────────────────────────
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main { kotlin.srcDirs = ['src/main/kotlin'] }
    }

    // ── Packaging ────────────────────────────────────────────────────────────
    // Strip unneeded metadata files from the AAB.
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}
