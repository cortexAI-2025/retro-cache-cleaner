plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Release signing ────────────────────────────────────────────────────────
// Credentials are read from keystore.properties (never committed to git).
// Copy keystore.properties.example → keystore.properties and fill in values.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.retrocache.cleaner'
    compileSdk 36

    defaultConfig {
        applicationId "com.retrocache.cleaner"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }

    // ── Signing ─────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            storeFile     keystoreProps['storeFile']     ? file(keystoreProps['storeFile'])     : null
            storePassword keystoreProps['storePassword'] ?: ''
            keyAlias      keystoreProps['keyAlias']      ?: ''
            keyPassword   keystoreProps['keyPassword']   ?: ''
        }
    }

    // ── Build types ─────────────────────────────────────────────────────────
    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            // Sign only when keystore.properties is present (keeps CI/debug builds working)
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
    }

    // ── AAB / Android App Bundle configuration ───────────────────────────────
    // Enables per-device asset splits → smaller download size on Play Store.
    bundle {
        language {
            // Split by language so only the device's locale is downloaded.
            enableSplit = true
        }
        density {
            // Split by screen density (hdpi, xhdpi, …) → smaller APK.
            enableSplit = true
        }
        abi {
            // Split by CPU ABI (arm64-v8a, x86_64, …) → smaller APK.
            enableSplit = true
        }
    }

    // ── Compile options ──────────────────────────────────────────────────────
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main { kotlin.srcDirs = ['src/main/kotlin'] }
    }

    // ── Packaging ────────────────────────────────────────────────────────────
    // Strip unneeded metadata files from the AAB.
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// ── Garde-fou : un AAB de release ne doit pas partir avec des mentions légales vides ──
tasks.register('checkLegalInfo') {
    doLast {
        def legal = file('src/main/res/values/legal.xml')
        if (legal.text.contains('A_COMPLETER')) {
            throw new GradleException('Mentions légales incomplètes : remplacez les A_COMPLETER dans ' + legal.path)
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkLegalInfo' }
